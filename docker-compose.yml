# Self-hosted white-label CMS.
#
# The app is stateless — Supabase (managed or self-hosted) holds the database,
# auth, and storage. This compose file runs just the web tier.
#
#   cp .env.example .env   # fill in the SUPABASE_* values
#   docker compose up -d --build
#   docker compose run --rm web bun run scripts/install.ts   # first-time seed
#   docker compose run --rm web bun run scripts/doctor.ts    # health check
services:
  web:
    build: .
    image: whitelabel-cms:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
